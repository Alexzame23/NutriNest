name: CI

on:
  pull_request:
  push:
    branches: [Development]

# A second push to a PR makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and check the database
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # These need no Android SDK, so they fail fast — before the ten minutes
      # of Gradle. They replay the real migrations against a database shaped
      # like a user's install and compile every DAO query against the result.
      - name: Migrations and shipped food database
        run: python3 tools/verify_migration.py

      - name: Recover an interrupted profile-table migration and retry
        run: python3 tools/verify_upgrade_interruption.py

      - name: DAO queries compile against the migrated schema
        run: python3 tools/check_dao_sql.py

      - name: Room export matches the migrated schema
        run: python3 tools/check_room_schema.py

      - name: Canonical rules and built-in recipe references
        env:
          PYTHONUTF8: '1'
        run: python3 tools/verify_curated_catalog.py

      - name: Translations are complete and consistent
        run: python3 tools/check_strings.py

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Price provider and synchronization contracts
        run: node --test backend/prices/provider.test.mjs backend/prices/price-sync.test.mjs backend/prices/matching.test.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # The wrapper is checked in without its executable bit.
      - name: Make the Gradle wrapper runnable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Room exports are up to date
        run: |
          git diff --exit-code -- app/schemas/
          test -z "$(git ls-files --others --exclude-standard -- app/schemas/)"

      - name: Upload the exported Room schemas
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: warn

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

# Validate Room migrations, recipes, preferences, publisher consumption and UI
# on an emulator with ./gradlew connectedDebugAndroidTest before a release.
